# ################################################################
# setup local PostgreSQL, Redis, Mailpit, and optional Adminer
#  e.g.
#    docker compose up -d
#    docker compose down
# ################################################################

services:

  db:
    container_name: postgres
    image: postgres:15-alpine # mac m1/m2
    #    image: postgres # mac intel
    healthcheck:
      test: [ "CMD", "pg_isready", "-q", "-d", "postgres", "-U", "root" ]
      timeout: 45s
      interval: 10s
      retries: 10
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: registry
    ports:
      - "5432:5432"

  adminer:
    image: arm64v8/adminer # mac m1/m2
    #    image: adminer # mac intel
    container_name: adminer
    restart: always
    ports:
      - "8999:8080"

  mailpit:
    container_name: mailpit
    image: axllent/mailpit:v1.33.0
    logging:
      driver: 'none'  # disable saving logs
    ports:
      - "1025:1025" # smtp server
      - "8025:8025" # web ui

  redis:
    container_name: redis
    image: redis:8.4-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      timeout: 5s
      interval: 10s
      retries: 5
