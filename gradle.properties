# Monorepo release baseline: all modules released as 2.0.0 from registry-api (2026-10-14).
# Core
springBootVersion=4.1.1
springSessionJdbcVersion=4.1.1
springOAuthVersion=7.1.1
foojayResolverVersion=1.0.0

# BOM / platform versions (used via `platform(...)`)
# 8.x is the line built against spring-boot-dependencies 4.1; it also manages
# com.google.cloud.sql:postgres-socket-factory, so no module pins that version.
springCloudGcpVersion=8.1.1

# Persistence / migration
# NOTE: hikariCPVersion and jakartaPersistenceVersion were removed — Boot 4.1.1's BOM
# now manages both versions directly and no module pins them explicitly anymore.
postgreSQLVersion=42.7.14
flywayVersion=12.4.0

# Common libs
lombokVersion=1.18.46
apacheCommonsVersion=3.20.0
apacheCommonsTextVersion=1.15.0
mapstructVersion=1.6.3
mockitoVersion=5.23.0
restAssuredVersion=6.0.1
testcontainersVersion=1.21.4
wiremockVersion=3.13.2
springRetryVersion=2.0.13
caffeineVersion=3.2.4
okhttpVersion=5.0.0
snakeyamlVersion=2.6
webjarsBootstrapVersion=5.3.8
webjarsJqueryVersion=3.7.1
webdrivermanagerVersion=6.3.3
passayVersion=1.6.6

# Netty / HTTP stack (Netty etc. forced via resolutionStrategy in root build.gradle;
# Tomcat is a constraint floor there, so it can only raise the Boot BOM version)
nettyVersion=4.2.18.Final
tomcatEmbedVersion=11.0.27
logbackVersion=1.5.38
httpcore5Version=5.4.3
openTelemetryApiVersion=1.64.0

# Jackson (enforced via resolutionStrategy in root build.gradle, CVE-2026-68497).
# jackson3Version covers every tools.jackson.* artifact; jackson2DatabindVersion covers the
# legacy com.fasterxml jackson-databind that SPQR and azure-core still pull in.
jackson3Version=3.2.3
jackson2DatabindVersion=2.22.3

# Registry / rollup specific
springDocVersion=3.1.0
swaggerVersion=2.2.52
shedlockVersion=7.10.1
slackApiClientVersion=1.47.0
logstashLogbackEncoderVersion=9.0
jasyptVersion=4.0.4
graphqlSpqrVersion=1.0.1
microsoftGraphVersion=6.65.0
springCloudAzureVersion=7.4.0

# Shared plugin versions
testLoggerVersion=4.0.0
osdetectorVersion=1.7.3

# Build parallelism
org.gradle.parallel=true
