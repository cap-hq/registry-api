plugins {
	id 'org.springframework.boot'
	id 'org.flywaydb.flyway'
	id 'com.adarshr.test-logger' version "${testLoggerVersion}"
	id 'com.google.osdetector' version "${osdetectorVersion}"
}

description = 'registry-auth'

// Netty/PostgreSQL/OpenTelemetry/logback/httpcore5/Jackson CVE-remediation versions
// are enforced globally via the root build.gradle's resolutionStrategy.eachDependency block.
// Tomcat comes from the Boot BOM (11.x), raised to a CVE floor by a root constraint.
// Testcontainers is NOT enforced globally (registry needs the 2.x renamed
// artifacts) so this module forces its own group version below.
configurations.matching { cfg ->
	cfg.name in ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath']
}.each { cfg ->
	cfg.resolutionStrategy.eachDependency { DependencyResolveDetails details ->
		if (details.requested.group == 'org.testcontainers') {
			details.useVersion testcontainersVersion
			details.because 'Boot 4.1.1 imports testcontainers-bom 2.0.5, which drops the postgresql/jdbc modules. Declaring 1.21.4 is not enough: highest-wins conflict resolution lets the BOM constraint pull the core artifact to 2.0.5 while the modules stay on 1.21.4, splitting the graph. Force the whole group so core and modules match.'
		}
	}
}

dependencies {
	constraints {
		// spring-cloud-gcp 8.1.1 -> cloud-sql schemas 1.29.0 declares protobuf-java
		// 4.36.0-RC1, which outranks the stable releases in conflict resolution.
		// Same floor as registry; yields once the BOM manages a higher stable version.
		implementation('com.google.protobuf:protobuf-java:4.36.1') {
			because 'Keep a release candidate (4.36.0-RC1, via com.google.cloud.sql:schemas) off the production classpath'
		}
	}

	// mac m1 netty dns fix
	if (osdetector.classifier == "osx-aarch_64") {
		runtimeOnly("io.netty:netty-resolver-dns-native-macos:${nettyVersion}:${osdetector.classifier}")
	}

	implementation "com.squareup.okhttp3:okhttp:${okhttpVersion}"

	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.boot:spring-boot-starter-graphql'
	implementation "io.leangen.graphql:graphql-spqr-spring-boot-starter:${graphqlSpqrVersion}"
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation "org.springframework.security:spring-security-oauth2-authorization-server:${springOAuthVersion}"
	// Boot 4 moved JDBC session auto-configuration out of spring-boot-autoconfigure into
	// the spring-boot-session-jdbc module; the library alone no longer registers
	// JdbcIndexedSessionRepository, which DefaultSecurityConfig autowires as
	// FindByIndexNameSessionRepository. The explicit line keeps the version pin visible.
	implementation "org.springframework.boot:spring-boot-starter-session-jdbc"
	implementation "org.springframework.session:spring-session-jdbc:${springSessionJdbcVersion}"
	implementation "com.github.ben-manes.caffeine:caffeine:${caffeineVersion}"

	implementation platform("com.google.cloud:spring-cloud-gcp-dependencies:${springCloudGcpVersion}")
	implementation "com.google.cloud:spring-cloud-gcp-starter-sql-postgresql"
	implementation 'com.google.cloud.sql:postgres-socket-factory'   // version managed by spring-cloud-gcp-dependencies above

	implementation 'io.opentelemetry:opentelemetry-api'				// version managed by spring boot dependencies
	implementation "org.webjars:webjars-locator-core"
	implementation "org.webjars:bootstrap:${webjarsBootstrapVersion}"
	implementation "org.webjars:jquery:${webjarsJqueryVersion}"
	implementation "org.yaml:snakeyaml:${snakeyamlVersion}"
	runtimeOnly "com.h2database:h2"
	implementation 'com.zaxxer:HikariCP' 							// version managed by spring boot dependencies
	runtimeOnly "org.postgresql:postgresql:${postgreSQLVersion}"
	// Boot 4 moved Flyway auto-configuration into the spring-boot-flyway module; with
	// flyway-core alone the migrations silently never run and the schema is never created.
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-core'						// version managed by spring boot dependencies
	implementation 'org.flywaydb:flyway-database-postgresql'		// version managed by spring boot dependencies
	implementation "com.github.ulisesbocchio:jasypt-spring-boot-starter:${jasyptVersion}"
	implementation "org.passay:passay:${passayVersion}"
	implementation "net.logstash.logback:logstash-logback-encoder:${logstashLogbackEncoderVersion}"
	implementation "net.javacrumbs.shedlock:shedlock-spring:${shedlockVersion}"
	implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:${shedlockVersion}"

	testImplementation "org.springframework.boot:spring-boot-starter-test"
	// Boot 4 split test support into per-technology modules: @AutoConfigureMockMvc moved
	// out of spring-boot-starter-test into the webmvc test starter, and TestRestTemplate
	// into the restclient test starter.
	testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
	testImplementation "org.springframework.boot:spring-boot-starter-restclient-test"
	testImplementation "org.springframework.security:spring-security-test"
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation 'org.seleniumhq.selenium:selenium-java' 		// version managed by spring boot dependencies
	testImplementation "io.github.bonigarcia:webdrivermanager:${webdrivermanagerVersion}"
	testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"
	testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
	testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
	testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
}

// Gradle Flyway tasks (flywayMigrate, flywayInfo, flywayRepair) must use the app's history table and
// validation, so keep this in sync with spring.flyway in application.yml. Pass url/user/password with -Pflyway.*
flyway {
	table = 'flyway_schema_history_v2'
	locations = ['filesystem:src/main/resources/db/migration']
	outOfOrder = true
	validateMigrationNaming = true
	baselineOnMigrate = true
	baselineVersion = '1.2026.10.20'
}

import org.gradle.api.tasks.testing.logging.TestExceptionFormat

tasks.withType(Test).configureEach {
	testLogging {
		exceptionFormat TestExceptionFormat.FULL
		showExceptions true
		showCauses true
		showStackTraces true

		afterSuite { desc, result ->
			if (!desc.parent) { // will match the outermost suite
				def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)"
				def startItem = '|  ', endItem = '  |'
				def repeatLength = startItem.length() + output.length() + endItem.length()
				println('\n' + ('-' * repeatLength) + '\n' + startItem + output + endItem + '\n' + ('-' * repeatLength))
			}
		}
	}
}
