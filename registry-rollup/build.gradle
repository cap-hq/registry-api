plugins {
    id 'org.springframework.boot'
    id 'com.adarshr.test-logger' version "${testLoggerVersion}"
    id 'com.google.osdetector' version "${osdetectorVersion}"
}

description = 'registry-rollup'

// Netty/logback/OpenTelemetry/httpcore5/PostgreSQL/Jackson CVE-remediation versions
// are enforced globally via the root build.gradle's resolutionStrategy.eachDependency block.
// Tomcat comes from the Boot BOM (11.x), raised to a CVE floor by a root constraint.

dependencies {
    // mac m1 netty dns fix
    if (osdetector.classifier == "osx-aarch_64") {
        runtimeOnly("io.netty:netty-resolver-dns-native-macos:${nettyVersion}:${osdetector.classifier}")
    }

    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    implementation 'org.yaml:snakeyaml'     // version managed by spring boot dependencies

    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-configuration-processor"
    implementation "org.springframework.boot:spring-boot-starter-webflux"
    implementation "org.springframework.boot:spring-boot-starter-cache"
    // Boot 4 renamed spring-boot-starter-aop (last published 4.0.0-M2) to
    // spring-boot-starter-aspectj, which bundles spring-aop + aspectjweaver.
    implementation "org.springframework.boot:spring-boot-starter-aspectj"
    implementation "org.springframework.boot:spring-boot-devtools"

    implementation 'org.springframework.security:spring-security-core'      // version managed by spring boot dependencies
    implementation 'org.springframework.security:spring-security-config'    // version managed by spring boot dependencies
    implementation 'org.springframework.security:spring-security-web'       // version managed by spring boot dependencies

    implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
    implementation("com.azure.spring:spring-cloud-azure-starter:${springCloudAzureVersion}") {
        // AMQP messaging (Service Bus / Event Hubs) is unused; excluding drops the
        // vulnerable proton-j 0.34.1 + qpid-proton-j-extensions. Azure still pins
        // proton-j 0.34.1 as of azure-core-amqp 2.12.1, so there is no upgrade path.
        exclude group: 'com.azure', module: 'azure-core-amqp'
    }

    implementation "io.leangen.graphql:graphql-spqr-spring-boot-starter:${graphqlSpqrVersion}"
    implementation "org.springframework.boot:spring-boot-starter-graphql"
    implementation "com.microsoft.graph:microsoft-graph:${microsoftGraphVersion}"
    implementation 'io.opentelemetry:opentelemetry-api'      // version managed by spring boot dependencies (otel-bom)
    implementation "net.logstash.logback:logstash-logback-encoder:${logstashLogbackEncoderVersion}"

    implementation "com.github.ulisesbocchio:jasypt-spring-boot-starter:${jasyptVersion}"

    implementation 'com.github.ben-manes.caffeine:caffeine'         // version managed by spring boot dependencies

    testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
}

springBoot {
    buildInfo()
}

import org.gradle.api.tasks.testing.logging.TestExceptionFormat

tasks.withType(Test).configureEach {
    testLogging {
        exceptionFormat TestExceptionFormat.FULL
        showExceptions true
        showCauses true
        showStackTraces true

        afterSuite { desc, result ->
            if (!desc.parent) { // will match the outermost suite
                def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)"
                def startItem = '|  ', endItem = '  |'
                def repeatLength = startItem.length() + output.length() + endItem.length()
                println('\n' + ('-' * repeatLength) + '\n' + startItem + output + endItem + '\n' + ('-' * repeatLength))
            }
        }
    }
}

// mapstruct-generated mapper classes excluded from coverage
// (lombok-generated code is excluded via @Generated annotation per lombok.config)
def jacocoExclude = ["**/mapper/**MapperImpl.class"]

tasks.jacocoTestReport {
    afterEvaluate {
        getClassDirectories().setFrom(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclude)
        })
    }
}

tasks.jacocoTestCoverageVerification {
    afterEvaluate {
        getClassDirectories().setFrom(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExclude)
        })
    }
}