pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version "${foojayResolverVersion}"
}

rootProject.name = 'registry-api'
include 'registry'
include 'registry-auth'
include 'registry-rollup'
